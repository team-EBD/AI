name: Deploy to cloudtype

# dev 에 푸시(=PR 머지 포함)되면 테스트 후 cloudtype 에 배포한다.
#
# ⚠️ deploy 잡은 저장소 변수 CLOUDTYPE_PROJECT 가 설정돼야만 실행된다.
#    cloudtype 대시보드의 GitHub 자동배포를 이미 쓰고 있다면 이 잡은 중복이므로
#    변수를 비워 둔 채로 두면 된다 (test 잡만 돌아간다).
on:
  push:
    branches: [dev]
  workflow_dispatch: # 수동 재배포용

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        # Gemini/DB 는 테스트에서 스텁으로 대체된다 (tests/conftest.py) — 외부 호출 없음
        run: python -m pytest -q

  deploy:
    name: cloudtype deploy
    needs: test
    runs-on: ubuntu-latest
    # 변수 미설정 = 아직 연동 안 함 → 배포를 건너뛴다 (기존 앱 설정 보호)
    if: vars.CLOUDTYPE_PROJECT != ''
    steps:
      - uses: actions/checkout@v4
      - name: Connect repository to cloudtype
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          # 기본 GITHUB_TOKEN 은 배포키(admin:public_key) 권한이 없어 connect 가 실패한다.
          # repo·workflow·admin:public_key 스코프의 PAT(classic)를 GHP_TOKEN 시크릿으로 넣는다.
          ghtoken: ${{ secrets.GHP_TOKEN }}
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          # 형식: <스페이스>/<프로젝트> (예: 741u741/ebd-ai)
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          # 배포 스펙은 cloudtype 대시보드 서비스의 'CLI' 탭 내용을 옮긴 것이다.
          # 이 스펙이 앱 설정을 통째로 덮어쓰므로, 대시보드에서 환경변수를 바꾸면
          # 여기에도 반영해야 다음 배포에서 되돌아간다.
          #
          # 시크릿(Gemini API 키·DB 접속 문자열)은 스펙에 적지 않고 GitHub Secrets 에서
          # 주입한다 — 리포에 평문으로 남기지 않기 위해서다. ai-server/.env 는 gitignore 라
          # 값이 대시보드에만 있으니, 시크릿이 비면 그대로 유실된다.
          yaml: |
            name: ebd-ai
            app: python@3.12
            options:
              ports: "8000"
              start: uvicorn app.main:app --host 0.0.0.0
              env:
                - name: GEMINI_API_KEY
                  value: ${{ secrets.GEMINI_API_KEY }}
                - name: GEMINI_MODEL
                  value: gemini-2.5-flash
                - name: AI_TIMEOUT_SECONDS
                  value: "30"
                - name: IMAGE_DOWNLOAD_TIMEOUT_SECONDS
                  value: "10"
                - name: DATABASE_URL
                  value: ${{ secrets.DATABASE_URL }}
                # /internal/* 인증 토큰. BE 레포의 INTERNAL_TOKEN 시크릿과 **같은 값**
                # 이어야 한다 — 값만 대시보드에 두면 한쪽만 바뀌어도 BE 호출이 전부
                # 401 이 된다 (2026-08-01 추천 502 사고). 비면 검증 자체가 꺼진다.
                - name: INTERNAL_TOKEN
                  value: ${{ secrets.INTERNAL_TOKEN }}
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
                # 서버 코드가 하위 디렉터리에 있다. cloudtype 이 생성해 주는 Actions
                # 스니펫에는 이 항목이 빠져 있어, 빼먹으면 저장소 루트에서 빌드하려다 실패한다.
                path: ai-server
