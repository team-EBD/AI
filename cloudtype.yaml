# cloudtype 배포 스펙 (.github/workflows/deploy.yml 이 참조)
#
# ⚠️ 이 파일은 배포 시 cloudtype 앱 설정을 "덮어쓴다".
#    아래 값은 현재 운영 앱 설정을 옮겨 적은 것이 아니라 기본 골격이다.
#    저장소 변수 CLOUDTYPE_PROJECT 를 설정해 자동배포를 켜기 전에, 대시보드의
#    현재 설정(포트·시작 명령·환경변수)과 대조해 맞출 것. 대조 없이 켜면 설정이 날아간다.
#
# 특히 GEMINI_API_KEY / DATABASE_URL 은 리포에 없고 대시보드에만 있으므로
# (AI/ai-server/.env 는 gitignore) env 목록에서 누락되지 않도록 주의.

name: eatlog-ai # TODO: cloudtype 앱 이름으로 교체
app: python@3.12

options:
  ports: 8000
  start: uvicorn app.main:app --host 0.0.0.0 --port 8000
  install: pip install -r requirements.txt
  rootDir: ai-server # 서버 코드가 하위 디렉터리에 있다
  env:
    - name: GEMINI_API_KEY
      secret: GEMINI_API_KEY # TODO: 대시보드 시크릿 이름과 맞출 것
    - name: DATABASE_URL
      secret: DATABASE_URL

context:
  git:
    url: git@github.com:team-EBD/AI.git
    ref: refs/heads/dev
